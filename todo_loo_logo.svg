    <!-- Kleine Blätter links/rechts -->
    <ellipse cx="-52" cy="6" rx="14" ry="7" fill="#b5ead7" opacity="0.7" transform="rotate(-20, -52, 6)" style="fill:rgb(181, 234, 215);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <ellipse cx="52" cy="6" rx="14" ry="7" fill="#b5ead7" opacity="0.7" transform="rotate(20, 52, 6)" style="fill:rgb(181, 234, 215);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

    <!-- Stängel -->
